name: CI & Deploy

# Every push and pull request is linted and built. Pushes to main also apply
# any new D1 migrations and deploy the Worker + site to Cloudflare.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HAS_CLOUDFLARE_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      # Skip (with a visible warning) instead of failing until the repo secrets exist.
      - if: env.HAS_CLOUDFLARE_SECRETS != 'true'
        run: echo "::warning title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN repository secret to enable automatic deploys (see ADMIN-BACKEND-SETUP.md)."
      - if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - if: env.HAS_CLOUDFLARE_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            d1 migrations apply studyshelf-db --remote
            deploy
