<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121a"><title>Moto Stunt | StudyShelf</title><style>
:root{color-scheme:dark;--bg:#11121a;--panel:#1c1e2b;--line:#34364a;--ink:#f6f5ff;--muted:#b5b8cf;--purple:#a88bff;--cyan:#72e6f4;--pink:#ff83c8;--lime:#c6f56c;--orange:#ffb86b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{padding:12px}.game-shell{max-width:1100px;margin:0 auto}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.game-title{margin:0;font-size:clamp(16px,2.2vw,23px);font-weight:850;letter-spacing:-.04em}.game-title span{color:var(--purple)}.game-hint{font-size:12px;color:var(--muted);text-align:right}.screen{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#171a27;box-shadow:0 18px 50px #0004}.screen canvas{display:block;width:100%;height:min(62vh,560px);min-height:280px;touch-action:none}.game-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}button{font:inherit}.restart{border:0;border-radius:10px;padding:10px 15px;background:var(--purple);color:#171020;font-weight:850;cursor:pointer}.restart:hover{filter:brightness(1.08)}.touch-controls{display:flex;gap:7px;flex-wrap:wrap}.touch-controls button{min-width:44px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#242638;color:var(--ink);font-weight:750;touch-action:none;user-select:none}.touch-controls button:active{background:#444064}.tiny{font-size:11px;color:#878ca9;margin:10px 2px 0}.screen:focus-within{outline:1px solid #a88bff66}
@media(max-width:600px){body{padding:8px}.game-top{align-items:flex-start}.game-hint{max-width:55%;font-size:11px}.screen canvas{height:54vh;min-height:280px}.status{font-size:12px}}

.game-title span{color:#c6f56c}
</style></head><body><main class="game-shell"><header class="game-top"><h1 class="game-title">STUDYSHELF <span>ARCADE</span> / MOTO STUNT</h1><div class="game-hint">BIKE · STUNT RACING</div></header><section class="screen"><canvas tabindex="0" aria-label="Playable game canvas"></canvas></section><footer class="game-footer"><span class="status">Build speed and steer your rider through the course.</span><button class="restart" type="button">Restart game</button></footer><nav class="touch-controls" aria-label="Touch controls"><button type="button" data-key="ArrowUp">Throttle</button><button type="button" data-key="ArrowDown">Brake</button><button type="button" data-key="ArrowLeft">◀ Lean</button><button type="button" data-key="ArrowRight">Lean ▶</button><button type="button" data-key="Space">Jump</button></nav><p class="tiny">Original StudyShelf mini-game · Runs locally on this site. Click the game, then use the controls. No external game portal is needed.</p></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=800,H=450,D=1;function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);const keys={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Enter'&&over)reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const d=e=>{e.preventDefault();keys[k]=true},u=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,u))});document.querySelector('.restart').onclick=reset;
let dist,speed,jumpY,vy,pitch,over,cleared,hazards,last=0;function reset(){dist=0;speed=90;jumpY=0;vy=0;pitch=0;over=false;cleared=false;hazards=[480,850,1270,1690,2110,2470].map((x,i)=>({x,type:i%2?'jump':'spikes'}));last=performance.now()}reset();function ground(wx){return H*.73+Math.sin(wx*.007)*19+Math.sin(wx*.016+1)*8+Math.sin(wx*.0025)*25}function update(dt){if(over)return;if(keys.ArrowUp||keys.KeyW)speed=Math.min(300,speed+100*dt);else speed=Math.max(65,speed-17*dt);if(keys.ArrowDown||keys.KeyS)speed=Math.max(45,speed-170*dt);dist+=speed*dt;const slope=(ground(dist+8)-ground(dist-8))/16;if(jumpY===0&&((slope<-.20&&speed>125)||keys.Space)){vy=-220-Math.max(0,-slope)*200;jumpY=1;keys.Space=false}if(jumpY>0){vy+=580*dt;jumpY-=vy*dt;if(jumpY<=0&&vy>0){jumpY=0;vy=0;pitch*=.6}else pitch+=(keys.ArrowLeft?-1:keys.ArrowRight?1:0)*2.4*dt}else pitch=(keys.ArrowLeft?-0.2:keys.ArrowRight?0.2:Math.atan(slope)*.5);if(Math.abs(pitch)>1.25&&jumpY===0)over=true;for(const h of hazards){if(Math.abs(h.x-dist)<20&&jumpY<24)over=true}if(dist>2850){over=true;cleared=true}}
function drawBike(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.lineWidth=5;ctx.strokeStyle='#111320';ctx.beginPath();ctx.arc(-18,11,12,0,Math.PI*2);ctx.arc(21,11,12,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ff83c8';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-18,11);ctx.lineTo(-3,-2);ctx.lineTo(21,11);ctx.lineTo(7,-3);ctx.lineTo(-18,11);ctx.stroke();ctx.fillStyle='#72e6f4';ctx.beginPath();ctx.moveTo(-7,-3);ctx.lineTo(7,-11);ctx.lineTo(18,-4);ctx.lineTo(9,1);ctx.closePath();ctx.fill();ctx.strokeStyle='#f6f5ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(-3,-24);ctx.lineTo(9,-30);ctx.moveTo(-3,-24);ctx.lineTo(-15,-17);ctx.stroke();ctx.fillStyle='#ffb86b';ctx.beginPath();ctx.arc(10,-34,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#292147');g.addColorStop(1,'#17283a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<10;i++){ctx.fillStyle='#5d6387';ctx.fillRect((i*111-dist*.15)%(W+40),50+(i%4)*25,3,3)}ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=5){ctx.lineTo(x,ground(dist+(x-W*.25)))}ctx.lineTo(W,H);ctx.fillStyle='#3b3949';ctx.fill();ctx.beginPath();for(let x=0;x<=W;x+=5){const yy=ground(dist+(x-W*.25));if(x===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy)}ctx.strokeStyle='#c6f56c';ctx.lineWidth=4;ctx.stroke();for(const h of hazards){const x=W*.25+(h.x-dist);if(x>-35&&x<W+35){if(h.type==='spikes'){ctx.fillStyle='#ff6d8c';ctx.beginPath();ctx.moveTo(x-13,ground(h.x));ctx.lineTo(x,ground(h.x)-27);ctx.lineTo(x+13,ground(h.x));ctx.fill()}else{ctx.fillStyle='#ffb86b';ctx.fillRect(x-17,ground(h.x)-14,34,14);ctx.fillStyle='#fff3d9';ctx.fillRect(x-11,ground(h.x)-10,22,3)}}}const gy=ground(dist)-26-jumpY;drawBike(W*.25,gy,pitch);ctx.fillStyle='#171827dd';ctx.beginPath();ctx.roundRect(13,13,130,44,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 12px system-ui';ctx.fillText('TRACK',25,30);ctx.fillStyle='#ff83c8';ctx.font='800 18px system-ui';ctx.fillText(Math.floor(dist)+' m',25,49);ctx.fillStyle='#fff';ctx.font='700 13px system-ui';ctx.fillText('SPEED '+Math.floor(speed),W-100,30);if(over){ctx.fillStyle='#0b0d17c9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=cleared?'#c6f56c':'#ff83c8';ctx.font='900 32px system-ui';ctx.fillText(cleared?'FINISH!':'WIPEOUT',W/2,H/2-10);ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText('Press Enter or tap Restart',W/2,H/2+20);ctx.textAlign='left'}else if(dist<20){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 13px system-ui';ctx.fillText('↑ throttle    ↓ brake    ← / → lean your rider',W/2,H-16);ctx.textAlign='left'}}function loop(t){const dt=Math.min(.03,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
