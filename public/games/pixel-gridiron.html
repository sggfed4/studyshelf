<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121a"><title>Pixel Gridiron | StudyShelf</title><style>
:root{color-scheme:dark;--bg:#11121a;--panel:#1c1e2b;--line:#34364a;--ink:#f6f5ff;--muted:#b5b8cf;--purple:#a88bff;--cyan:#72e6f4;--pink:#ff83c8;--lime:#c6f56c;--orange:#ffb86b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{padding:12px}.game-shell{max-width:1100px;margin:0 auto}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.game-title{margin:0;font-size:clamp(16px,2.2vw,23px);font-weight:850;letter-spacing:-.04em}.game-title span{color:var(--purple)}.game-hint{font-size:12px;color:var(--muted);text-align:right}.screen{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#171a27;box-shadow:0 18px 50px #0004}.screen canvas{display:block;width:100%;height:min(62vh,560px);min-height:280px;touch-action:none}.game-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}button{font:inherit}.restart{border:0;border-radius:10px;padding:10px 15px;background:var(--purple);color:#171020;font-weight:850;cursor:pointer}.restart:hover{filter:brightness(1.08)}.touch-controls{display:flex;gap:7px;flex-wrap:wrap}.touch-controls button{min-width:44px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#242638;color:var(--ink);font-weight:750;touch-action:none;user-select:none}.touch-controls button:active{background:#444064}.tiny{font-size:11px;color:#878ca9;margin:10px 2px 0}.screen:focus-within{outline:1px solid #a88bff66}
@media(max-width:600px){body{padding:8px}.game-top{align-items:flex-start}.game-hint{max-width:55%;font-size:11px}.screen canvas{height:54vh;min-height:280px}.status{font-size:12px}}

.game-title span{color:#a88bff}
</style></head><body><main class="game-shell"><header class="game-top"><h1 class="game-title">STUDYSHELF <span>ARCADE</span> / PIXEL GRIDIRON</h1><div class="game-hint">ARCADE FOOTBALL</div></header><section class="screen"><canvas tabindex="0" aria-label="Playable game canvas"></canvas></section><footer class="game-footer"><span class="status">Dodge the defense and carry the ball into the end zone.</span><button class="restart" type="button">Restart game</button></footer><nav class="touch-controls" aria-label="Touch controls"><button type="button" data-key="ArrowLeft">◀</button><button type="button" data-key="ArrowRight">▶</button><button type="button" data-key="ArrowUp">▲</button><button type="button" data-key="ArrowDown">▼</button><button type="button" data-key="Space">Sprint</button></nav><p class="tiny">Original StudyShelf mini-game · Runs locally on this site. Click the game, then use the controls. No external game portal is needed.</p></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=800,H=450,D=1;function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);const keys={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Enter'&&over)resetPlay()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const d=e=>{e.preventDefault();keys[k]=true},u=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,u))});document.querySelector('.restart').onclick=resetPlay;
let player,defenders,score,play,over,won,last=0,invuln=0;function resetPlay(){player={x:W*.13,y:H*.51};defenders=[];for(let i=0;i<5;i++)defenders.push({x:W*(.38+i*.13),y:H*(.2+(i%3)*.27),speed:45+i*7});score=0;play=1;over=false;won=false;invuln=0;last=performance.now()}resetPlay();function resetField(){player={x:W*.1,y:H*.5};defenders=[];for(let i=0;i<5;i++)defenders.push({x:W*(.37+i*.125),y:H*(.18+(i%3)*.29),speed:50+i*7});play++;invuln=1.1}
function update(dt){if(over)return;const s=(keys.Space||keys.ShiftLeft||keys.ShiftRight)?1.55:1;let ax=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ay=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);if(keys.KeyD)ax=1;if(keys.KeyA)ax=-1;if(keys.KeyW)ay=-1;if(keys.KeyS)ay=1;player.x+=ax*205*s*dt;player.y+=ay*190*s*dt;player.x=Math.max(16,Math.min(W-23,player.x));player.y=Math.max(H*.17,Math.min(H*.84,player.y));invuln=Math.max(0,invuln-dt);
for(const d of defenders){const dx=player.x-d.x,dy=player.y-d.y,di=Math.hypot(dx,dy)||1;d.x+=dx/di*d.speed*dt;d.y+=dy/di*d.speed*dt;if(invuln<=0&&di<22){if(play>=4){over=true;won=false}else resetField()}}
if(player.x>W*.88){score+=7;play++;if(play>4){over=true;won=true}else resetField()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#184f43';ctx.fillRect(0,0,W,H);for(let i=0;i<9;i++){ctx.fillStyle=i%2?'#1b5748':'#205d4d';ctx.fillRect(i*W/9,0,W/9,H)}ctx.strokeStyle='#a9e1ad';ctx.lineWidth=2;for(let i=0;i<=10;i++){const x=W*i/10;ctx.beginPath();ctx.moveTo(x,H*.12);ctx.lineTo(x,H*.9);ctx.stroke();ctx.fillStyle='#d6f1cf';ctx.font='11px monospace';ctx.fillText(String(i*10),x+4,H*.15)}ctx.strokeRect(2,H*.12,W-4,H*.78);ctx.fillStyle='#c6f56c';ctx.fillRect(W*.88,H*.12,W*.12,H*.78);ctx.fillStyle='#194d40';ctx.fillRect(W*.88,H*.12,3,H*.78);
// yard marker stripes
for(let i=0;i<22;i++){const x=(i*43+score*5)%W;ctx.fillStyle='#d0f0d044';ctx.fillRect(x,H*.2,2,H*.6)}
for(const d of defenders){ctx.fillStyle='#ff697f';ctx.beginPath();ctx.arc(d.x,d.y,14,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff0f2';ctx.fillRect(d.x-6,d.y-3,12,3);ctx.fillStyle='#6a2a45';ctx.fillRect(d.x-7,d.y+9,14,4)}ctx.fillStyle='#72e6f4';ctx.beginPath();ctx.arc(player.x,player.y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#e8fbff';ctx.fillRect(player.x-7,player.y-5,14,4);ctx.fillStyle='#126778';ctx.fillRect(player.x-8,player.y+9,16,4);ctx.fillStyle='#a88bff';ctx.beginPath();ctx.ellipse(player.x-18,player.y,5,9,-.3,0,Math.PI*2);ctx.fill();if(invuln>0){ctx.strokeStyle='#c6f56c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(player.x,player.y,22,0,Math.PI*2);ctx.stroke()}
ctx.fillStyle='#151a22dd';ctx.beginPath();ctx.roundRect(13,13,172,45,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 12px system-ui';ctx.fillText('DRIVE COUNT',25,30);ctx.fillStyle='#c6f56c';ctx.font='800 18px system-ui';ctx.fillText('PLAY '+play+' / 4',25,49);ctx.fillStyle='#f6f5ff';ctx.font='800 13px system-ui';ctx.fillText('TOUCHDOWNS '+score/7,W-150,30);if(over){ctx.fillStyle='#071b17c9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=won?'#c6f56c':'#ff83c8';ctx.font='900 32px system-ui';ctx.fillText(won?'TOUCHDOWN!':'TACKLED!',W/2,H/2-11);ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText(won?'Great run. You won the game!':'The defense stopped your run.',W/2,H/2+14);ctx.fillText('Press Enter or tap Restart',W/2,H/2+37);ctx.textAlign='left'}else if(play===1&&player.x<W*.2){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 13px system-ui';ctx.fillText('ARROWS / WASD move    SPACE sprint    Reach the bright end zone',W/2,H-15);ctx.textAlign='left'}}function loop(t){const dt=Math.min(.03,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
