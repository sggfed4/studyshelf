<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121a"><title>Web Swing | StudyShelf</title><style>
:root{color-scheme:dark;--bg:#11121a;--panel:#1c1e2b;--line:#34364a;--ink:#f6f5ff;--muted:#b5b8cf;--purple:#a88bff;--cyan:#72e6f4;--pink:#ff83c8;--lime:#c6f56c;--orange:#ffb86b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{padding:12px}.game-shell{max-width:1100px;margin:0 auto}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.game-title{margin:0;font-size:clamp(16px,2.2vw,23px);font-weight:850;letter-spacing:-.04em}.game-title span{color:var(--purple)}.game-hint{font-size:12px;color:var(--muted);text-align:right}.screen{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#171a27;box-shadow:0 18px 50px #0004}.screen canvas{display:block;width:100%;height:min(62vh,560px);min-height:280px;touch-action:none}.game-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}button{font:inherit}.restart{border:0;border-radius:10px;padding:10px 15px;background:var(--purple);color:#171020;font-weight:850;cursor:pointer}.restart:hover{filter:brightness(1.08)}.touch-controls{display:flex;gap:7px;flex-wrap:wrap}.touch-controls button{min-width:44px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#242638;color:var(--ink);font-weight:750;touch-action:none;user-select:none}.touch-controls button:active{background:#444064}.tiny{font-size:11px;color:#878ca9;margin:10px 2px 0}.screen:focus-within{outline:1px solid #a88bff66}
@media(max-width:600px){body{padding:8px}.game-top{align-items:flex-start}.game-hint{max-width:55%;font-size:11px}.screen canvas{height:54vh;min-height:280px}.status{font-size:12px}}

.game-title span{color:#ff83c8}
</style></head><body><main class="game-shell"><header class="game-top"><h1 class="game-title">STUDYSHELF <span>ARCADE</span> / WEB SWING</h1><div class="game-hint">SWINGING · TIMING</div></header><section class="screen"><canvas tabindex="0" aria-label="Playable game canvas"></canvas></section><footer class="game-footer"><span class="status">Hold to catch a hook; release to launch toward the platform.</span><button class="restart" type="button">Restart game</button></footer><nav class="touch-controls" aria-label="Touch controls"><button type="button" data-key="Space">Hold to hook</button><button type="button" data-key="ArrowLeft">◀</button><button type="button" data-key="ArrowRight">▶</button></nav><p class="tiny">Original StudyShelf mini-game · Runs locally on this site. Click the game, then use the controls. No external game portal is needed.</p></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=800,H=450,D=1;function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);makeAnchors()}addEventListener('resize',resize);resize();const keys={};let pointer=false;addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Enter'&&done)reset()});addEventListener('keyup',e=>keys[e.code]=false);c.addEventListener('pointerdown',e=>{pointer=true;c.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','pointerleave'].forEach(v=>c.addEventListener(v,()=>pointer=false));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const d=e=>{e.preventDefault();keys[k]=true},u=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,u))});document.querySelector('.restart').onclick=reset;
let anchors=[],x,y,vx,vy,attached,anchor,L,done,dead,score,last=0;function makeAnchors(){anchors=[];for(let i=0;i<6;i++)anchors.push({x:W*(.23+i*.145),y:H*(.25+(i%2)*.055)})}resize();function reset(){x=W*.08;y=H*.66;vx=125;vy=-20;attached=false;anchor=-1;L=0;done=false;dead=false;score=0;last=performance.now()}reset();
function attach(){let best=-1,bd=1e9;anchors.forEach((a,i)=>{const d=Math.hypot(a.x-x,a.y-y);if(d<bd&&d<260){best=i;bd=d}});if(best>=0){attached=true;anchor=best;L=Math.max(70,Math.hypot(anchors[best].x-x,anchors[best].y-y))}}
function update(dt){if(done||dead)return;if((keys.Space||pointer)&&!attached)attach();if(!(keys.Space||pointer)&&attached)attached=false;if(keys.ArrowLeft)vx-=110*dt;if(keys.ArrowRight)vx+=110*dt;vx=Math.max(-220,Math.min(330,vx));vy+=650*dt;x+=vx*dt;y+=vy*dt;if(attached&&anchor>=0){const a=anchors[anchor],dx=x-a.x,dy=y-a.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;x=a.x+nx*L;y=a.y+ny*L;const radial=vx*nx+vy*ny;vx-=radial*nx;vy-=radial*ny}
if(y>H*.86){dead=true}if(x>W*.92&&y<H*.79){done=true;score=1000+Math.max(0,Math.floor((H*.86-y)*3))}if(x<12||y<5){x=Math.max(12,Math.min(W-10,x));y=Math.max(8,y);vx*=.65;vy*=.5}}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#242146');g.addColorStop(1,'#14283a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<70;i++){ctx.fillStyle='#aaa8ff65';ctx.fillRect((i*131)%W,(i*67)%(H*.78),2,2)}ctx.fillStyle='#30374b';ctx.fillRect(0,H*.86,W,H*.14);ctx.fillStyle='#72e6f4';ctx.fillRect(W*.91,H*.77,W*.08,H*.09);ctx.fillStyle='#1d283a';ctx.fillRect(W*.91,H*.77,W*.08,H*.025);
anchors.forEach((a,i)=>{ctx.strokeStyle='#67627d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,0);ctx.lineTo(a.x,a.y);ctx.stroke();ctx.fillStyle=i===anchor&&attached?'#c6f56c':'#ff83c8';ctx.beginPath();ctx.arc(a.x,a.y,8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff9';ctx.lineWidth=2;ctx.stroke()});if(attached&&anchor>=0){ctx.strokeStyle='#c6f56c';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(anchors[anchor].x,anchors[anchor].y);ctx.lineTo(x,y);ctx.stroke()}
ctx.save();ctx.translate(x,y);ctx.strokeStyle='#f6f5ff';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(0,-18,8,0,Math.PI*2);ctx.moveTo(0,-10);ctx.lineTo(0,12);ctx.moveTo(0,-2);ctx.lineTo(-11,6);ctx.moveTo(0,-2);ctx.lineTo(11,5);ctx.moveTo(0,12);ctx.lineTo(-9,26);ctx.moveTo(0,12);ctx.lineTo(9,26);ctx.stroke();ctx.restore();
ctx.fillStyle='#171827dd';ctx.beginPath();ctx.roundRect(13,13,143,43,10);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 12px system-ui';ctx.fillText('SWING SPEED',25,30);ctx.fillStyle='#72e6f4';ctx.font='800 18px system-ui';ctx.fillText(Math.floor(Math.hypot(vx,vy))+' km/h',25,48);
if(done||dead){ctx.fillStyle='#0b0d17c9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=done?'#c6f56c':'#ff83c8';ctx.font='900 31px system-ui';ctx.fillText(done?'LEVEL COMPLETE':'MISSED THE PLATFORM',W/2,H/2-12);ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText('Press Enter or tap Restart',W/2,H/2+20);ctx.textAlign='left'}else if(x<W*.15){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 13px system-ui';ctx.fillText('HOLD SPACE / PRESS & HOLD to hook · RELEASE to launch',W/2,H-15);ctx.textAlign='left'}}
function loop(t){const dt=Math.min(.025,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
