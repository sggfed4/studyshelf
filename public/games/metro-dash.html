<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121a"><title>Metro Dash | StudyShelf</title><style>
:root{color-scheme:dark;--bg:#11121a;--panel:#1c1e2b;--line:#34364a;--ink:#f6f5ff;--muted:#b5b8cf;--purple:#a88bff;--cyan:#72e6f4;--pink:#ff83c8;--lime:#c6f56c;--orange:#ffb86b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{padding:12px}.game-shell{max-width:1100px;margin:0 auto}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.game-title{margin:0;font-size:clamp(16px,2.2vw,23px);font-weight:850;letter-spacing:-.04em}.game-title span{color:var(--purple)}.game-hint{font-size:12px;color:var(--muted);text-align:right}.screen{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#171a27;box-shadow:0 18px 50px #0004}.screen canvas{display:block;width:100%;height:min(62vh,560px);min-height:280px;touch-action:none}.game-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}button{font:inherit}.restart{border:0;border-radius:10px;padding:10px 15px;background:var(--purple);color:#171020;font-weight:850;cursor:pointer}.restart:hover{filter:brightness(1.08)}.touch-controls{display:flex;gap:7px;flex-wrap:wrap}.touch-controls button{min-width:44px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#242638;color:var(--ink);font-weight:750;touch-action:none;user-select:none}.touch-controls button:active{background:#444064}.tiny{font-size:11px;color:#878ca9;margin:10px 2px 0}.screen:focus-within{outline:1px solid #a88bff66}
@media(max-width:600px){body{padding:8px}.game-top{align-items:flex-start}.game-hint{max-width:55%;font-size:11px}.screen canvas{height:54vh;min-height:280px}.status{font-size:12px}}

.game-title span{color:#72e6f4}
</style></head><body><main class="game-shell"><header class="game-top"><h1 class="game-title">STUDYSHELF <span>ARCADE</span> / METRO DASH</h1><div class="game-hint">ENDLESS RUNNER · REACTION</div></header><section class="screen"><canvas tabindex="0" aria-label="Playable game canvas"></canvas></section><footer class="game-footer"><span class="status">Move lanes, jump obstacles, collect coins.</span><button class="restart" type="button">Restart game</button></footer><nav class="touch-controls" aria-label="Touch controls"><button type="button" data-key="ArrowLeft">◀ Lane</button><button type="button" data-key="ArrowRight">Lane ▶</button><button type="button" data-key="Space">Jump</button><button type="button" data-key="ArrowDown">Duck</button></nav><p class="tiny">Original StudyShelf mini-game · Runs locally on this site. Click the game, then use the controls. No external game portal is needed.</p></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=800,H=450,D=1;
function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*D);c.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Enter'&&dead)reset()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true};const up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
document.querySelector('.restart').addEventListener('click',reset);
let lane,py,jv,duckTime,obstacles,coins,spawn,coinSpawn,score,speed,dead,started,last=0;function reset(){lane=1;py=0;jv=0;duckTime=0;obstacles=[];coins=[];spawn=.5;coinSpawn=.7;score=0;speed=240;dead=false;started=true;last=performance.now()}reset();
function roundRect(x,y,w,h,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function update(dt){if(dead)return;score+=dt*10;speed=240+Math.min(210,score*1.25);if(keys.ArrowLeft||keys.KeyA){lane=Math.max(0,lane-1);keys.ArrowLeft=keys.KeyA=false}if(keys.ArrowRight||keys.KeyD){lane=Math.min(2,lane+1);keys.ArrowRight=keys.KeyD=false}if((keys.Space||keys.ArrowUp||keys.KeyW)&&py===0)jv=-530; if(keys.ArrowDown||keys.KeyS){duckTime=.3;keys.ArrowDown=keys.KeyS=false}duckTime=Math.max(0,duckTime-dt);
py+=jv*dt;jv+=1370*dt;if(py>0){py=0;jv=0}
spawn-=dt;if(spawn<=0){obstacles.push({lane:Math.floor(Math.random()*3),y:-35,type:Math.random()<.25?'train':'barrier'});spawn=Math.max(.38,1.0-score/150)+Math.random()*.22}
coinSpawn-=dt;if(coinSpawn<=0){const l=Math.floor(Math.random()*3);for(let i=0;i<4;i++)coins.push({lane:l,y:-i*31-15,taken:false});coinSpawn=1.2+Math.random()*.65}
obstacles.forEach(o=>o.y+=speed*dt);coins.forEach(o=>o.y+=speed*dt);obstacles=obstacles.filter(o=>o.y<H+60);coins=coins.filter(o=>o.y<H+30&&!o.taken);
const px=W*(.25+.25*lane), base=H-70-py;for(const o of obstacles){if(o.lane===lane&&Math.abs(o.y-(H-80))<30&&(o.type==='train'?py>-28:duckTime<=0)){dead=true}}
for(const coin of coins){if(!coin.taken&&coin.lane===lane&&Math.abs(coin.y-(H-80))<30){coin.taken=true;score+=5}}
}
function draw(){ctx.clearRect(0,0,W,H);const grd=ctx.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#252044');grd.addColorStop(1,'#101b2b');ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
for(let i=0;i<14;i++){const x=(i*89-(score*3)%89);roundRect(x,35+(i%4)*21,3,3,2,'#7776b8')}
const roadW=W*.77,left=(W-roadW)/2;ctx.fillStyle='#282b3b';ctx.beginPath();ctx.moveTo(W*.39,0);ctx.lineTo(W*.61,0);ctx.lineTo(left+roadW,H);ctx.lineTo(left,H);ctx.closePath();ctx.fill();ctx.strokeStyle='#53536b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W*.39,0);ctx.lineTo(left,H);ctx.moveTo(W*.61,0);ctx.lineTo(left+roadW,H);ctx.stroke();
for(let ln=1;ln<3;ln++){const tx=W*(.25+.25*ln);ctx.strokeStyle='#62617e';ctx.setLineDash([18,17]);ctx.beginPath();ctx.moveTo(W*.5+(ln-1)*W*.055,0);ctx.lineTo(tx,H);ctx.stroke();ctx.setLineDash([])}
for(const coin of coins){if(coin.taken)continue;const x=W*(.25+.25*coin.lane);ctx.fillStyle='#ffd76d';ctx.beginPath();ctx.arc(x,coin.y,7,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff1b5';ctx.lineWidth=2;ctx.stroke()}
for(const o of obstacles){const x=W*(.25+.25*o.lane);if(o.type==='train'){roundRect(x-34,o.y-20,68,45,9,'#ff719d');roundRect(x-24,o.y-12,48,12,4,'#ffdbe7');ctx.fillStyle='#812c63';ctx.fillRect(x-23,o.y+10,46,5)}else{roundRect(x-26,o.y-18,52,36,8,'#f6a36d');ctx.fillStyle='#793d42';ctx.fillRect(x-18,o.y-10,36,6);ctx.fillStyle='#ffdbb7';ctx.fillRect(x-23,o.y+11,46,4)}}
const x=W*(.25+.25*lane),y=H-74-py;const crouch=duckTime>0&&py===0;roundRect(x-17,y-(crouch?17:25),34,crouch?36:46,10,'#a88bff');roundRect(x-13,y-(crouch?24:38),26,crouch?18:22,8,'#ffd1af');roundRect(x-10,y-33,5,4,2,'#282044');roundRect(x+5,y-33,5,4,2,'#282044');ctx.fillStyle='#72e6f4';ctx.fillRect(x-12,y+5,24,4);ctx.fillStyle='#191b2c';ctx.fillRect(x-13,y+19,9,10);ctx.fillRect(x+4,y+19,9,10);
roundRect(14,14,110,42,10,'#191b2cdd');ctx.fillStyle='#f8f7ff';ctx.font='800 14px system-ui';ctx.fillText('DISTANCE',25,31);ctx.fillStyle='#72e6f4';ctx.font='800 18px system-ui';ctx.fillText(Math.floor(score)+' m',25,48);
if(dead){ctx.fillStyle='#0b0d17c9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#ff83c8';ctx.font='900 34px system-ui';ctx.fillText('RUN OVER',W/2,H/2-13);ctx.fillStyle='#fff';ctx.font='15px system-ui';ctx.fillText('Press Enter or tap Restart',W/2,H/2+20);ctx.textAlign='left'}else if(score<3){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='800 13px system-ui';ctx.fillText('← → change lanes     SPACE / ↑ jump     ↓ duck',W/2,H-18);ctx.textAlign='left'}}
function loop(t){const dt=Math.min(.035,(t-(last||t))/1000);last=t;if(started)update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
