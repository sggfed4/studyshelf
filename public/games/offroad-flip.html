<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11121a"><title>Offroad Flip | StudyShelf</title><style>
:root{color-scheme:dark;--bg:#11121a;--panel:#1c1e2b;--line:#34364a;--ink:#f6f5ff;--muted:#b5b8cf;--purple:#a88bff;--cyan:#72e6f4;--pink:#ff83c8;--lime:#c6f56c;--orange:#ffb86b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}body{padding:12px}.game-shell{max-width:1100px;margin:0 auto}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 10px}.game-title{margin:0;font-size:clamp(16px,2.2vw,23px);font-weight:850;letter-spacing:-.04em}.game-title span{color:var(--purple)}.game-hint{font-size:12px;color:var(--muted);text-align:right}.screen{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#171a27;box-shadow:0 18px 50px #0004}.screen canvas{display:block;width:100%;height:min(62vh,560px);min-height:280px;touch-action:none}.game-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted)}button{font:inherit}.restart{border:0;border-radius:10px;padding:10px 15px;background:var(--purple);color:#171020;font-weight:850;cursor:pointer}.restart:hover{filter:brightness(1.08)}.touch-controls{display:flex;gap:7px;flex-wrap:wrap}.touch-controls button{min-width:44px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#242638;color:var(--ink);font-weight:750;touch-action:none;user-select:none}.touch-controls button:active{background:#444064}.tiny{font-size:11px;color:#878ca9;margin:10px 2px 0}.screen:focus-within{outline:1px solid #a88bff66}
@media(max-width:600px){body{padding:8px}.game-top{align-items:flex-start}.game-hint{max-width:55%;font-size:11px}.screen canvas{height:54vh;min-height:280px}.status{font-size:12px}}

.game-title span{color:#ffb86b}
</style></head><body><main class="game-shell"><header class="game-top"><h1 class="game-title">STUDYSHELF <span>ARCADE</span> / OFFROAD FLIP</h1><div class="game-hint">DRIVING · PHYSICS</div></header><section class="screen"><canvas tabindex="0" aria-label="Playable game canvas"></canvas></section><footer class="game-footer"><span class="status">Throttle, brake, balance, and clear the rough track.</span><button class="restart" type="button">Restart game</button></footer><nav class="touch-controls" aria-label="Touch controls"><button type="button" data-key="ArrowLeft">◀ Brake</button><button type="button" data-key="ArrowRight">Gas ▶</button><button type="button" data-key="Space">Jump</button></nav><p class="tiny">Original StudyShelf mini-game · Runs locally on this site. Click the game, then use the controls. No external game portal is needed.</p></main><script>
const c=document.querySelector('canvas'),ctx=c.getContext('2d');let W=800,H=450,D=1;function resize(){const r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const keys={};addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Enter'&&dead)reset()});addEventListener('keyup',e=>keys[e.code]=false);document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const d=e=>{e.preventDefault();keys[k]=true},u=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,u))});document.querySelector('.restart').onclick=reset;
let dist,speed,jumpY,vy,pitch,dead,score,obstacles,last=0;function reset(){dist=0;speed=120;jumpY=0;vy=0;pitch=0;dead=false;score=0;obstacles=[420,760,1130,1480,1830,2210,2550,2930,3300].map((x,i)=>({x,type:i%3===0?'crate':'cone'}));last=performance.now()}reset();
function ground(wx){return H*.74+Math.sin(wx*.009)*24+Math.sin(wx*.0039+1.2)*29+Math.sin(wx*.018)*6}
function drawCar(x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillStyle='#111320';for(const ox of [-27,24]){ctx.beginPath();ctx.arc(ox,14,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#a9b1c8';ctx.beginPath();ctx.arc(ox,14,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111320'}ctx.fillStyle='#ffb86b';ctx.beginPath();ctx.moveTo(-37,0);ctx.lineTo(-28,-15);ctx.lineTo(17,-16);ctx.lineTo(34,-2);ctx.lineTo(39,7);ctx.lineTo(-38,7);ctx.closePath();ctx.fill();ctx.fillStyle='#8a4b3a';ctx.beginPath();ctx.moveTo(-17,-16);ctx.lineTo(-8,-28);ctx.lineTo(11,-27);ctx.lineTo(23,-15);ctx.closePath();ctx.fill();ctx.restore()}
function update(dt){if(dead)return;if(keys.ArrowRight||keys.ArrowUp||keys.KeyD) speed=Math.min(360,speed+130*dt);else speed=Math.max(80,speed-26*dt);if(keys.ArrowLeft||keys.ArrowDown||keys.KeyA)speed=Math.max(50,speed-180*dt);dist+=speed*dt;score=Math.floor(dist/8);
const slope=(ground(dist+6)-ground(dist-6))/12;const ramp=Math.max(0,-slope-.20);if(jumpY===0&&((ramp>.04&&speed>165)||keys.Space)){vy=-Math.min(360,180+ramp*260);jumpY=1;keys.Space=false}if(jumpY>0){vy+=700*dt;jumpY-=vy*dt;if(jumpY<=0&&vy>0){jumpY=0;vy=0;pitch*=.55}else{pitch+=(keys.ArrowLeft||keys.KeyA?-1:keys.ArrowRight||keys.KeyD?1:0)*2.2*dt}}else{pitch=Math.atan(slope)*.75;if(Math.abs(pitch)>.78)dead=true}
for(const o of obstacles){if(Math.abs(o.x-dist)<22&&jumpY<25)dead=true}if(dist>3700){dead=true}}
function roadY(wx){return ground(wx)}function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#26254b');g.addColorStop(1,'#18283a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<35;i++){const x=(i*73-dist*.18)%(W+40);ctx.fillStyle=i%3?'#53547a':'#6b7398';ctx.fillRect((x+W+40)%(W+40),30+(i%5)*23,2,2)}
ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+5;x+=5){const wx=dist+(x-W*.25);ctx.lineTo(x,roadY(wx))}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#3b394a';ctx.fill();ctx.beginPath();for(let x=0;x<=W+5;x+=5){const wx=dist+(x-W*.25);if(x===0)ctx.moveTo(x,roadY(wx));else ctx.lineTo(x,roadY(wx))}ctx.strokeStyle='#ffca91';ctx.lineWidth=4;ctx.stroke();
for(const o of obstacles){const x=W*.25+(o.x-dist);if(x>-50&&x<W+50){ctx.fillStyle=o.type==='crate'?'#ed7d73':'#c7f56c';ctx.beginPath();if(o.type==='crate')ctx.rect(x-14,ground(o.x)-32,28,32);else{ctx.moveTo(x,ground(o.x)-30);ctx.lineTo(x-13,ground(o.x));ctx.lineTo(x+13,ground(o.x));ctx.closePath()}ctx.fill()}}
let gx=W*.25, gy=ground(dist)-33; if(dist>0&&dist<4200) drawCar(gx,gy-jumpY,pitch);
ctx.fillStyle='#171827dd';ctx.beginPath();ctx.roundRect(13,13,150,47,11);ctx.fill();ctx.fillStyle='#fff';ctx.font='800 12px system-ui';ctx.fillText('DISTANCE',25,31);ctx.fillStyle='#ffb86b';ctx.font='800 19px system-ui';ctx.fillText(Math.floor(dist)+' m',25,50);ctx.fillStyle='#fff';ctx.font='700 13px system-ui';ctx.fillText('SPEED  '+Math.floor(speed),W-116,31);ctx.fillStyle='#a8aac0';ctx.font='11px system-ui';ctx.fillText('37 km',W-116,47);
if(dead){ctx.fillStyle='#0b0d17c9';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle=dist>3700?'#c6f56c':'#ffb86b';ctx.font='900 32px system-ui';ctx.fillText(dist>3700?'TRACK CLEARED':'CRASH!',W/2,H/2-10);ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.fillText('Press Enter or tap Restart',W/2,H/2+20);ctx.textAlign='left'}else if(dist<25){ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='800 13px system-ui';ctx.fillText('RIGHT / ↑ accelerate     LEFT / ↓ brake and reverse',W/2,H-17);ctx.textAlign='left'}}
function loop(t){const dt=Math.min(.03,(t-(last||t))/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
